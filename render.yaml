services:
  - type: web
    name: splitdebt-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore        # đổi nếu database ở region khác
    branch: main             # chủ dự án có thể đổi sang dev2-dat khi demo
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: FIREBASE_ENABLED
        value: "true"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: SUPABASE_KEY
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000"
