name: Verify SplitDebt
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit + integration tests
        run: bash ./mvnw --batch-mode clean verify
        working-directory: api
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: api/target/site/jacoco
          if-no-files-found: ignore

  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start isolated H2 backend
        shell: bash
        run: |
          mkdir -p api/data test-results
          rm -f api/data/splitdebt-e2e* || true
          cd api
          SPRING_PROFILES_ACTIVE=e2e bash ./mvnw spring-boot:run >../test-results/backend-e2e.out.log 2>../test-results/backend-e2e.err.log &
          echo $! > ../test-results/backend-e2e.pid
      - name: Wait for API
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat test-results/backend-e2e.out.log || true
          cat test-results/backend-e2e.err.log || true
          exit 1
      - name: Full REST contract flow
        run: python3 tools/e2e_api.py
        env:
          SPLITDEBT_E2E_URL: http://127.0.0.1:18080/api
      - name: Response-time smoke test
        run: python3 tools/performance_smoke.py --requests 30 --concurrency 5 --max-p95-ms 3000
        env:
          SPLITDEBT_E2E_URL: http://127.0.0.1:18080/api
      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-logs
          path: test-results
          if-no-files-found: ignore

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
        working-directory: frontend
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
        working-directory: frontend
      - name: Unit + widget tests with coverage
        run: flutter test --coverage
        working-directory: frontend
      - name: Web build smoke test
        run: flutter build web --debug
        working-directory: frontend
      - name: Android build smoke test
        run: flutter build apk --debug
        working-directory: frontend
      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
