spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/splitdebt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=GROUPS}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
server:
  port: ${PORT:8080}
  error:
    include-message: always
splitdebt:
  jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-deploying-splitdebt}
  jwt-ttl-hours: ${JWT_TTL_HOURS:168}
  allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:10}
    dev-return-code: ${PASSWORD_RESET_DEV_RETURN_CODE:false}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${MAIL_FROM:no-reply@splitdebt.local}
    starttls: ${SMTP_STARTTLS:true}
