spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 120000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8081

logging:
  level:
    root: INFO
    '[org.springframework.boot.autoconfigure]': WARN
    '[org.springframework.web]': WARN
    '[org.springframework.security]': WARN
    '[org.hibernate]': WARN
    '[org.hibernate.orm.deprecation]': ERROR
    '[org.hibernate.tool.schema]': WARN
    '[org.apache.catalina]': WARN
    '[org.apache.tomcat]': WARN
    '[org.apache.coyote]': WARN
    '[com.zaxxer.hikari]': WARN
    '[com.splitdebt.api]': INFO
    '[com.splitdebt.api.service.FcmTokenService]': WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    expirationMs: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
  google:
    # OAuth Web client ID phải khớp audience của Google ID token từ ứng dụng.
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
