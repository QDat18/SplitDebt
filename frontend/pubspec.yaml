name: split_debt
description: "SplitDebt Flutter application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  dio: ^5.11.1

  # Auth / Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.5

  # State management
  flutter_riverpod: ^2.5.1

  # Supabase
  supabase_flutter: ^2.5.0

  # Firebase / FCM
  firebase_core: ^2.30.0
  firebase_messaging: ^14.9.0

  # Dev4 dashboard
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env