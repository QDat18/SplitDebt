name: split_debt
description: "SplitDebt Flutter application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  dio: ^5.11.1
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.5.1
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  fl_chart: ^0.68.0
  intl: any
  image_picker: ^1.1.2
  google_mlkit_text_recognition: 0.15.0
  mobile_scanner: 6.0.11
  pdf: 3.11.3
  printing: 5.14.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/client.env
