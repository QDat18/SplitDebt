<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <meta name="description" content="A Group Expense Management Application Integrated with a Debt Ledger">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="apple-mobile-web-app-title" content="SplitDebt">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>SplitDebt</title>

  <link rel="manifest" href="manifest.json">
</head>

<body>

  <script>
    async function initializeSplitDebt() {
      if ('serviceWorker' in navigator) {
        try {
          console.log(
            '[FCM] Registering Service Worker...'
          );

          const registration =
            await navigator.serviceWorker.register(
              '/firebase-messaging-sw.js',
              { scope: '/firebase-cloud-messaging-push-scope' }
            );

          console.log(
            '[FCM] Service Worker registered:',
            registration.scope
          );

          // FCM activates its own worker when requesting a token.
          // Do not wait for a worker controlling the app's root scope.

        } catch (error) {
          console.error(
            '[FCM] Service Worker registration failed:',
            error
          );
        }
      } else {
        console.warn(
          '[FCM] Service Worker không được hỗ trợ.'
        );
      }

      // Sau khi xử lý Service Worker mới load Flutter.
      const flutterScript =
        document.createElement(
          'script'
        );

      flutterScript.src =
        'flutter_bootstrap.js';

      flutterScript.async =
        true;

      document.body.appendChild(
        flutterScript
      );
    }

    initializeSplitDebt();
  </script>

</body>

</html>
